# Bot5e – docker-compose
#
#   docker compose up --build    # first time  (builds image, pulls LLM)
#   docker compose up            # subsequent  (fast start, models cached)
#   docker compose down          # stop + remove container  (volumes kept)
#
# Open  http://localhost:8501  in your browser.

services:
  bot5e:
    build: .
    ports:
      - "8501:8501"            # Streamlit UI
    volumes:
      # --- required bind-mount: your local copy of the SRD PDF ---
      - ./SRD-OGL_V5.1.pdf:/app/SRD-OGL_V5.1.pdf:ro
      # --- persistent model caches (named volumes) ---
      - ollama_data:/root/.ollama              # LLM files  (~4-6 GB)
      - hf_cache:/root/.cache/huggingface      # HuggingFace models (classifier, embedder, reranker)

    # ---------------------------------------------------------------
    # GPU support – uncomment the block below if you have an NVIDIA
    # GPU and nvidia-container-toolkit installed on the host.
    # ---------------------------------------------------------------
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  ollama_data:
  hf_cache:
